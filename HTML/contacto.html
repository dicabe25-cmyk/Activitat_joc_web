<body>
    <header>
        <nav>
            <div class="logo">Dídac<span>TECH</span></div>
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="productos.html">Catàleg</a></li>
                <li><a href="contacto.html" class="active">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-card">
            <h1>Contacta amb mi</h1>
            <p>Tens algun dubte tècnic? Envia'm un missatge i et respondré el més aviat possible.</p>
            
            <form id="contactForm">
                <div class="input-group">
                    <label>Nom Complet</label>
                    <input type="text" placeholder="Escriu el teu nom..." required>
                </div>

                <div class="input-group">
                    <label>Correu Electrònic</label>
                    <input type="email" placeholder="exemple@correu.com" required>
                </div>

                <div class="input-group">
                    <label>El teu Missatge</label>
                    <textarea rows="5" placeholder="En què et puc ajudar?"></textarea>
                </div>

                <button type="submit" class="btn-primary">Enviar Missatge ➔</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Dídac Castillo - Bemen-3 FP</p>
    </footer>
